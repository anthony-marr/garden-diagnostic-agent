[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garden-diagnostic-agent"
version = "0.1.0"
description = "MCP server and agent host for garden diagnostics: Open-Meteo weather plus a SQLite planting log, with schema-checked tool I/O."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
garden-mcp-server = "garden_mcp.server:main"
garden-agent = "garden_mcp.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
